[package]
name = "tramme-desktop"
version = "0.22.0"
description = "the Tramme editor as a native app"
edition = "2021"
default-run = "tramme-desktop"

[lib]
name = "tramme_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the quick bubble is a transparent round window, which macOS only draws with it
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-tramme-device = { path = "../plugin-device" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
dirs = "6"
unicode-normalization = "0.1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
regex = "1"
base64 = "0.22"
url = "2"

# the computer's own: a second launch handed to the running app, the system keychain
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

[dev-dependencies]
tempfile = "3"

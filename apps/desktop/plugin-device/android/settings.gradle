// Only for opening this library on its own; the app's generated project includes it.
pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google()
    }
    resolutionStrategy {
        eachPlugin {
            switch (requested.id.id) {
                case "com.android.library":
                    useVersion("8.5.1")
                    break
                case "org.jetbrains.kotlin.android":
                    useVersion("1.9.25")
                    break
            }
        }
    }
}

include ':tauri-android'
project(':tauri-android').projectDir = new File('./.tauri/tauri-api')

# The web app at app.tramme.dev, with accounts: deployed by the private platform
# repository (its Production workflow builds the editor of this repository's main
# with TRAMME_ENV=production, the accounts backend's image, and deploys the Worker
# with the backend behind it). On every push to main, once the checks pass, this
# workflow tells it that main moved. A manual run on main does the same.
# See docs/environments.md.

name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time, and the last push wins: an older run never lands after a newer one
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  app:
    name: Tell the platform repository (app.tramme.dev)
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PLATFORM_DISPATCH_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
    steps:
      # the same token as the beta's (Contents: read and write on tramme-platform only): it sends the event
      # the platform's Production workflow listens to, and that one deploys the app
      - name: Send the event
        run: |
          if [ -z "$PLATFORM_DISPATCH_TOKEN" ]; then
            echo "::error::the secret PLATFORM_DISPATCH_TOKEN is missing: the app was not deployed"
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $PLATFORM_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/tramme-platform/dispatches \
            -d '{"event_type":"public-main","client_payload":{"sha":"${{ github.sha }}"}}'

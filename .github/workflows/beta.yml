# The beta environment: the app (apps/editor served by apps/worker, the "beta"
# Wrangler environment, with its own accounts backend) at beta.app.tramme.dev
# and the site at beta.tramme.dev, both deployed again on every push to
# develop, once the checks pass. Both are built with TRAMME_ENV=beta so their
# links lead to each other (brand/environments.ts). A manual run on develop
# deploys the same way. See docs/environments.md.

name: Beta

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time, and the last push wins: an older run never lands after a newer one
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  app:
    name: Deploy the app (beta.app.tramme.dev)
    needs: checks
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      TRAMME_ENV: beta
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare's secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::the repository's secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are missing (Settings, Secrets and variables, Actions): the beta app was not deployed"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci
      # builds the editor, then wrangler deploy --env beta (the backend's image is built here: Docker is on the runner)
      - run: npm run deploy:beta

  site:
    name: Deploy the site (beta.tramme.dev)
    needs: checks
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      TRAMME_ENV: beta
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare's secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::the repository's secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are missing (Settings, Secrets and variables, Actions): the beta site was not deployed"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci
      # builds the site, then wrangler deploy as the Worker tramme-site-beta on beta.tramme.dev
      - run: npm run site:deploy:beta

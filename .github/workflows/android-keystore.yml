# Makes the Android upload key, once (run by hand from the Actions tab).
#
# Before: set the repository secrets ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_PASSWORD (any long passwords; Android's own tools accept the two
# being equal).
# After: download the artifact upload.jks from the run, store its base64 as the
# secret ANDROID_KEYSTORE_BASE64 (`base64 -w0 upload.jks`) and `tramme` as
# ANDROID_KEY_ALIAS, keep a copy of the file offline, then delete the artifact
# (it lives one day anyway). If the key is ever lost, Google can reset the
# upload key: Play App Signing holds the real one.
#
# The certificate names the publisher: CN=Tramme, O=Qualris. The signing step of
# android.yml refuses to publish anything signed otherwise.

name: Android upload key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    name: Make the keystore
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: The passwords
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::set the repository secrets ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD first (Settings, Secrets and variables, Actions)"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate the key
        run: |
          keytool -genkeypair -v -keystore upload.jks -alias tramme -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Tramme, O=Qualris" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: upload.jks
          path: upload.jks
          retention-days: 1
          if-no-files-found: error

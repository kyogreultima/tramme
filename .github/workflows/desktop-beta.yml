# The desktop app's beta build (apps/desktop), made on develop when the app's
# version changes, and by hand from the Actions tab: Windows and Linux, built
# with TRAMME_ENV=beta so the app's links
# lead to the beta (brand/environments.ts), and published as a prerelease
# vX.Y.Z-beta.N that the beta site offers (apps/site/src/lib/download.ts), the
# site being deployed again once it is out. The stable app (desktop.yml) is
# released from main and never sees a prerelease: GitHub's "latest" skips them.
#
# The beta app is its own product, "Tramme Beta" (identifier app.tramme.desktop.beta),
# so installing it does not replace an installed Tramme and the other way round.
# macOS is left out as in the stable release: an app Apple has not signed cannot
# be installed (apps/desktop/downloads.ts).

name: Desktop app (beta)

on:
  push:
    branches: [develop]
    # a new version of the app always changes the first; the second makes a change to this workflow try itself
    # (a workflow that only runs by hand is not listed by GitHub until it is on the default branch)
    paths: [apps/desktop/src-tauri/tauri.conf.json, .github/workflows/desktop-beta.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-beta

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        name: The tag of this build
        run: |
          if [ "$GITHUB_REF" != refs/heads/develop ]; then
            echo "::error::the beta build is made from develop, not from $GITHUB_REF_NAME"
            exit 1
          fi
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "tag=v$version-beta.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  # the suite must pass before anything is built (.github/workflows/ci.yml)
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: [plan, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            args: --bundles nsis
          - name: Linux
            # the oldest supported Ubuntu: the AppImage runs on its glibc and newer
            runner: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.runner }}
    env:
      # the editor inside the app is built for the beta: its links lead to beta.tramme.dev
      TRAMME_ENV: beta
      # the beta app is another product: its own name and identifier (merged over tauri.conf.json)
      TAURI_CONFIG: '{"productName":"Tramme Beta","identifier":"app.tramme.desktop.beta"}'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci
      - name: Build the editor and the app
        run: npm run desktop:build -- ${{ matrix.args }}
      - name: Name the installers for the release
        run: node scripts/desktop-release.ts out ${{ needs.plan.outputs.tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-beta-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  release:
    name: Release
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        # the tag is made on the commit that was built
        run: |
          gh release create "$TAG" out/* --prerelease --target "$GITHUB_SHA" --title "Tramme Beta $TAG" \
            --notes "A beta build of the desktop app, made from develop at $GITHUB_SHA. It is its own app, Tramme Beta, and does not replace Tramme."

  site:
    name: Deploy the beta site
    needs: release
    runs-on: ubuntu-latest
    env:
      TRAMME_ENV: beta
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # the site reads the beta's latest build (apps/site/src/lib/download.ts)
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Cloudflare's secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::the repository's secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are missing: the build is out, the beta site was not deployed"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run site:deploy:beta

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 320px; height: 180px; background: transparent; }
  #stage { position: relative; width: 320px; height: 180px; overflow: hidden; background: transparent; }
  .panel { position: absolute; left: 45px; top: 27px; width: 230px; height: 126px; border-radius: 8px; background: #f4d35e; }
  .bar { position: absolute; left: 70px; top: 67px; width: 180px; height: 14px; border-radius: 7px; background: #264653; transform-origin: left center; }
  .mark { position: absolute; left: 70px; top: 102px; width: 28px; height: 28px; border-radius: 50%; background: #e76f51; }
</style>
<div id="stage" data-composition-id="gsap" data-width="320" data-height="180" data-duration="1" data-fps="6">
  <div class="panel"></div><div class="bar"></div><div class="mark"></div>
</div>
<script src="/vendor/gsap.min.js"></script>
<script type="module">
  import { sceneController } from '/vendor/scene-runtime.js';
  const timeline = gsap.timeline({ paused: true });
  timeline.fromTo('.panel', { x: -60, rotation: -7 }, { x: 0, rotation: 0, duration: 1, ease: 'none' }, 0);
  timeline.fromTo('.bar', { scaleX: 0.1 }, { scaleX: 1, duration: 1, ease: 'none' }, 0);
  timeline.fromTo('.mark', { x: 0, y: 0 }, { x: 150, y: -8, duration: 1, ease: 'none' }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines.gsap = timeline;
  const controller = sceneController(1);
  controller.gsap(timeline);
  controller.install(window);
  window.__hf.seek(0);
</script>

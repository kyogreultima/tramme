<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  @font-face { font-family: GeistScene; src: url('./geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; width: 320px; height: 180px; background: transparent; }
  #stage { position: relative; width: 320px; height: 180px; overflow: hidden; background: transparent; }
  .plate { position: absolute; inset: 30px 38px; border-radius: 18px; background: linear-gradient(130deg, #2430aa, #ee65a1); }
  svg { position: absolute; inset: 0; width: 320px; height: 180px; overflow: visible; }
  #orbit { fill: none; stroke: #fef4d8; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 270; }
  #dot { fill: #fef4d8; }
  .label { position: absolute; left: 95px; top: 90px; color: #fff8e8; font: 700 22px GeistScene; letter-spacing: 0.08em; }
</style>
<div id="stage" data-composition-id="css-svg" data-no-timeline data-width="320" data-height="180" data-duration="1" data-fps="6">
  <div class="plate" id="plate"></div>
  <div class="label">SCENE</div>
  <svg viewBox="0 0 320 180" aria-hidden="true">
    <path id="orbit" d="M 65 124 C 115 30, 205 30, 255 124" />
    <circle id="dot" cx="65" cy="124" r="8" />
  </svg>
</div>
<script>
  const plate = document.getElementById('plate');
  const orbit = document.getElementById('orbit');
  const dot = document.getElementById('dot');
  window.__hf = {
    duration: 1,
    seek(t) {
      const p = Math.max(0, Math.min(1, t));
      plate.style.transform = `translateX(${(1 - p) * -65}px) rotate(${(1 - p) * -8}deg)`;
      plate.style.opacity = String(0.3 + 0.7 * p);
      orbit.style.strokeDashoffset = String(270 * (1 - p));
      dot.setAttribute('cx', String(65 + 190 * p));
    },
  };
  window.__hf.seek(0);
</script>
